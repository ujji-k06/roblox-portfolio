<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17141d;
  --ink-2:#211d29;
  --paper:#f8f3e8;
  --paper-2:#fffdf7;
  --red:#f34759;
  --yellow:#ffdf69;
  --blue:#6177f7;
  --muted:#6f6872;
  --line:#17141d22;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Inter Tight",Arial,Helvetica,sans-serif;
  --mono:"IBM Plex Mono","Courier New",monospace;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--body);font-weight:500}
a{color:inherit;text-decoration:none}
button{font:inherit}
img,video,iframe{display:block}
::selection{background:var(--yellow);color:var(--ink)}

.shell{width:min(calc(100% - 56px),1320px);margin-inline:auto}

/* Header ---------------------------------------------------------------- */
.topbar{
  position:sticky;top:0;z-index:60;color:var(--paper);
  background:rgba(23,20,29,.94);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(14px) saturate(125%);
  -webkit-backdrop-filter:blur(14px) saturate(125%);
  transition:background .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.topbar.is-scrolled{
  background:rgba(23,20,29,.985);
  border-bottom-color:rgba(255,255,255,.10);
  box-shadow:0 7px 22px rgba(10,8,14,.18);
}
.nav{height:64px;display:flex;align-items:center;gap:22px}
.brand{
  display:flex;align-items:center;gap:11px;flex:0 0 auto;
  font:700 10px var(--mono);letter-spacing:.085em;text-transform:uppercase;
}
.brandmark{
  display:grid;place-items:center;width:31px;height:31px;
  border:1px solid rgba(255,255,255,.16);border-radius:3px;
  background:rgba(255,255,255,.035);color:var(--yellow);
  font:900 20px/1 var(--display);
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}
.brand:hover .brandmark{
  border-color:rgba(255,223,105,.55);
  background:rgba(255,223,105,.07);
  transform:translateY(-1px);
}
.brand-copy{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand-copy strong{font:700 10px var(--mono);letter-spacing:.085em}
.brand-copy span{color:#9a949f;font:600 8px var(--mono);letter-spacing:.07em}
.links{
  margin-left:auto;display:flex;align-items:center;gap:24px;
  font:700 8.5px var(--mono);letter-spacing:.105em;text-transform:uppercase;
}
.links a{
  position:relative;padding:8px 0;color:#b7b1bb;
  transition:color .18s ease,transform .18s ease;
}
.links a:after{
  content:"";position:absolute;left:0;right:100%;bottom:1px;height:1px;
  background:var(--yellow);transition:right .2s cubic-bezier(.2,.8,.2,1);
}
.links a:hover{color:var(--paper);transform:translateY(-1px)}
.links a:hover:after{right:0}
.contact-link{
  flex:0 0 auto;position:relative;padding:8px 0;color:#b7b1bb;
  font:700 8.5px var(--mono);letter-spacing:.105em;text-transform:uppercase;
  transition:color .18s ease,transform .18s ease;
}
.contact-link:after{
  content:"";position:absolute;left:0;right:100%;bottom:1px;height:1px;
  background:var(--yellow);transition:right .2s cubic-bezier(.2,.8,.2,1);
}
.contact-link:hover{color:var(--paper);transform:translateY(-1px)}
.contact-link:hover:after{right:0}
.contact-link:active{transform:translateY(0)}

/* Hero ------------------------------------------------------------------ */
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--paper);border-bottom:2px solid var(--ink)}
.hero:before{content:none}

/* Interactive dotted field for dark sections ---------------------------- */
.dark-dot-section{position:relative;overflow:hidden;isolation:isolate}
.dark-dot-section > :not(.interactive-dot-field){position:relative;z-index:1}
.interactive-dot-field{
  position:absolute;z-index:0;inset:0;width:100%;height:100%;
  pointer-events:none;opacity:.74
}
.hero-inner{position:relative;min-height:760px;padding:90px 0 104px;display:grid;grid-template-columns:.94fr 1.06fr;gap:14px;align-items:center}
.hero-copy{position:relative;z-index:4;padding-right:12px}
.eyebrow{display:flex;align-items:center;gap:10px;font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.eyebrow:before{content:"";width:28px;height:7px;background:var(--red);transform:skew(-24deg)}
.hero-kicker{display:flex;align-items:center;gap:12px;margin-bottom:18px;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.hero-kicker:before{content:"";width:28px;height:7px;background:var(--red);transform:skew(-24deg)}
.hero-status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(113,227,140,.28);border-radius:999px;color:#a9efb8;background:rgba(26,70,37,.28);font-size:7px;letter-spacing:.06em}
.hero-status i{width:5px;height:5px;border-radius:50%;background:#71e38c;box-shadow:0 0 0 3px rgba(113,227,140,.10)}
.hero h1{margin:0;font:900 clamp(80px,9vw,150px)/.78 var(--display);letter-spacing:-.03em;text-transform:uppercase}
.hero h1 span{display:block;width:max-content;max-width:100%}
.hero h1 .accent{color:var(--yellow);font-size:.72em;font-style:italic;transform:translateX(16px) rotate(-3deg);transform-origin:left center}
.hero h1 .hero-last{position:relative}
.hero-dot{display:inline;color:var(--red)}
.hero-lead{max-width:520px;margin:30px 0 22px;color:#d7d0d8;font-size:17px;line-height:1.6}
.hero-tags{display:flex;flex-wrap:wrap;gap:0;margin:0 0 24px;color:#9f98a4;font:700 8px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.hero-tag{display:flex;align-items:center;padding:0;border:0;background:none}
.hero-tag:not(:last-child):after{content:"/";margin:0 10px;color:#5f5863}
.actions{display:flex;gap:11px;flex-wrap:wrap}
.btn{min-height:50px;display:inline-flex;align-items:center;justify-content:center;padding:13px 17px;border:2px solid currentColor;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn:hover{transform:translate(-3px,-3px)}
.btn.primary{background:var(--yellow);color:var(--ink);border-color:var(--yellow);box-shadow:5px 5px 0 var(--red)}
.btn.primary:hover{box-shadow:8px 8px 0 var(--red)}
.btn.ghost{color:var(--paper);background:transparent;box-shadow:4px 4px 0 rgba(255,255,255,.16)}
.hero-media-wrap{
  position:relative;min-width:0;width:calc(100% + 26px);margin-left:-26px;transform:translateY(7px);
  perspective:820px;perspective-origin:50% 48%
}
.hero-media{
  --hero-tilt-x:0deg;--hero-tilt-y:0deg;--hero-shift-x:0px;--hero-shift-y:0px;
  position:relative;height:min(55vw,550px);min-height:430px;overflow:hidden;
  border:8px solid var(--paper);background:#23202b;
  clip-path:polygon(0 0,100% 0,100% 87%,92% 100%,0 100%);
  transform:translate3d(var(--hero-shift-x),var(--hero-shift-y),0) rotate(2.15deg) rotateX(var(--hero-tilt-x)) rotateY(var(--hero-tilt-y));
  transform-style:preserve-3d;transform-origin:50% 50%;
  filter:drop-shadow(8px 8px 0 var(--ink));
  transition:transform .11s cubic-bezier(.18,.82,.2,1),filter .16s cubic-bezier(.2,.8,.2,1),opacity .08s linear;
  will-change:transform;cursor:pointer
}
.hero-media-wrap.is-hovered .hero-media{filter:drop-shadow(13px 13px 0 var(--red))}

.hero-click-cue{
  position:absolute;z-index:7;top:16px;right:18px;
  display:inline-flex;align-items:center;gap:7px;padding:7px 10px 7px 8px;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--red);pointer-events:none;
  font:700 8px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  transform:translateZ(26px) rotate(2deg);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease,box-shadow .22s ease;
  animation:hero-click-cue-bob 1.8s cubic-bezier(.2,.75,.25,1) infinite;
}
.hero-click-cue svg{width:15px;height:15px;flex:0 0 auto;overflow:visible}
.hero-click-cue svg path{fill:var(--yellow);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.hero-click-cue:after{
  content:"";position:absolute;left:10px;top:9px;width:8px;height:8px;border:1.5px solid var(--red);border-radius:50%;
  opacity:0;transform:scale(.45);animation:hero-click-ping 1.8s ease-out infinite;pointer-events:none
}
.hero-media-wrap.is-hovered .hero-click-cue{transform:translate3d(-2px,-3px,30px) rotate(-2deg);box-shadow:6px 6px 0 var(--red)}
.hero-media.has-been-clicked .hero-click-cue{opacity:0;transform:translate3d(5px,-7px,30px) rotate(8deg) scale(.9);animation:none}
@keyframes hero-click-cue-bob{
  0%,62%,100%{translate:0 0}
  72%{translate:0 -3px}
  82%{translate:0 1px}
  91%{translate:0 -1px}
}
@keyframes hero-click-ping{
  0%,55%{opacity:0;transform:scale(.45)}
  60%{opacity:.75;transform:scale(.55)}
  82%,100%{opacity:0;transform:scale(1.8)}
}

.hero-media:before{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(145deg,#d6e0ff 0 34%,#6177f7 34% 54%,#222635 54% 63%,#254a35 63% 100%)}
.hero-media:after{content:"GAMEPLAY / LOOP";position:absolute;z-index:4;left:16px;bottom:16px;padding:7px 9px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);font:700 8px var(--mono);letter-spacing:.09em;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.hero-media-wrap.is-hovered .hero-media:after{transform:translate(2px,-2px) rotate(-1deg)}
.hero-media .media-fill{
  --hero-media-x:0px;--hero-media-y:0px;
  position:absolute;z-index:2;inset:-1.5%;width:103%;height:103%;object-fit:cover;
  transform:translate3d(var(--hero-media-x),var(--hero-media-y),0) scale(1.015);
  transition:transform .11s cubic-bezier(.18,.82,.2,1);will-change:transform
}
.hero-media iframe.media-fill{border:0}

/* Click shatter ---------------------------------------------------------- */
.shatter-stage{
  position:absolute;z-index:90;pointer-events:none;overflow:visible;
  transform-style:preserve-3d;will-change:transform
}
.shatter-piece{
  position:absolute;inset:0;overflow:visible;transform-style:preserve-3d;
  will-change:transform;pointer-events:none
}
.shatter-surface{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  min-height:0!important;margin:0!important;transform:none!important;transition:none!important;
  pointer-events:none!important;will-change:auto!important
}
.shatter-surface.hero-media{filter:none!important;cursor:default!important}
.shatter-surface.contact-panel,.shatter-surface.about-card,.shatter-surface.side-card{box-shadow:none!important;transform:none!important}
.shatter-crack{
  position:absolute;z-index:120;height:1px;width:var(--crack-length,90px);
  transform-origin:0 50%;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,.98),rgba(23,20,29,.82) 34%,rgba(255,255,255,.62) 61%,transparent);
  box-shadow:0 1px 0 rgba(23,20,29,.22);
  animation:shatter-crack .23s cubic-bezier(.15,.8,.2,1) forwards
}
@keyframes shatter-crack{
  0%{opacity:0;transform:rotate(var(--crack-angle)) scaleX(.02)}
  22%{opacity:1}
  68%{opacity:.9;transform:rotate(var(--crack-angle)) scaleX(1)}
  100%{opacity:0;transform:rotate(var(--crack-angle)) scaleX(1.08)}
}

.media-placeholder{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 13px;background:rgba(248,243,232,.92);color:var(--ink);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font:700 9px var(--mono);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}

/* Marquee --------------------------------------------------------------- */
.marquee{position:relative;z-index:10;overflow:hidden;background:var(--red);border-block:3px solid var(--ink);padding:13px 0}
.marquee:before,.marquee:after{content:"";position:absolute;z-index:3;top:0;bottom:0;width:72px;pointer-events:none}
.marquee:before{left:0;background:linear-gradient(90deg,var(--red),transparent)}
.marquee:after{right:0;background:linear-gradient(-90deg,var(--red),transparent)}
.marquee-track{display:flex;width:max-content;will-change:transform;animation:marquee 28s linear infinite}
.marquee-group{display:flex;align-items:center;flex-shrink:0;font:900 clamp(28px,3vw,42px)/1 var(--display);text-transform:uppercase;letter-spacing:.005em}
.marquee-item{display:flex;align-items:center;white-space:nowrap}
.marquee-item:after{content:"✦";padding:0 30px;color:var(--paper);font-size:.72em}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}

/* Sections -------------------------------------------------------------- */
.section{padding:100px 0}
.section-head{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:end;margin-bottom:42px}
.section-head h2{margin:10px 0 0;font:900 clamp(62px,7vw,104px)/.84 var(--display);letter-spacing:-.025em;text-transform:uppercase}
.section-head h2 em{color:var(--red);font-style:normal}
.section-note{max-width:300px;margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.5}

/* Work ------------------------------------------------------------------ */
.project-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:28px}
.project-card{grid-column:span 6;min-width:0}
.project-card:nth-child(1){grid-column:span 8}
.project-card:nth-child(2){grid-column:span 4}
.project-card:nth-child(5n){grid-column:span 7}
.project-card:nth-child(5n+1):not(:first-child){grid-column:span 5}
.project-link{display:block;height:100%}
.project-preview{position:relative;overflow:hidden;height:390px;background:#20222d;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s cubic-bezier(.2,.8,.2,1)}
.project-card:nth-child(1) .project-preview{height:520px}
.project-card:nth-child(2) .project-preview{height:520px}
.project-link:hover .project-preview{transform:translate(-4px,-4px);box-shadow:13px 13px 0 var(--red)}
.project-preview:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#cbd8ff 0 40%,#6177f7 40% 56%,#26334b 56% 64%,#2e5b3a 64%);transition:transform .5s ease}
.project-card:nth-child(3n+2) .project-preview:before{background:linear-gradient(135deg,#ffdf69 0 28%,#f34759 28% 48%,#4c3c77 48% 70%,#17141d 70%)}
.project-card:nth-child(3n+3) .project-preview:before{background:linear-gradient(160deg,#d5e8f2 0 38%,#69b6bd 38% 52%,#274455 52% 68%,#1d2d26 68%)}
.project-preview .media-fill{position:absolute;z-index:2;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.project-preview iframe.media-fill{border:0}
.project-link:hover .project-preview .media-fill{transform:scale(1.025)}
.project-preview .media-placeholder{background:var(--yellow)}
.project-index{position:absolute;z-index:4;top:14px;left:14px;padding:7px 9px;background:var(--paper);border:2px solid var(--ink);font:700 8px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.project-open{position:absolute;z-index:4;right:14px;bottom:14px;width:42px;height:42px;display:grid;place-items:center;background:var(--yellow);border:2px solid var(--ink);font:900 19px var(--body);transition:transform .2s ease}
.project-link:hover .project-open{transform:translate(2px,-2px) rotate(-7deg)}
.project-copy{padding:22px 2px 10px}
.project-copy h3{margin:0;font:900 clamp(36px,3.5vw,54px)/.9 var(--display);text-transform:uppercase}
.project-copy p{max-width:680px;margin:10px 0 0;color:#57505a;font-size:15px;line-height:1.5}


/* Clips ----------------------------------------------------------------- */
.clips-section{background:var(--ink);color:var(--paper);border-block:2px solid var(--ink)}
.clips-section .section-note{color:#aaa3ae}
.clips-section .section-head h2 em{color:var(--yellow)}
.clip-grid{display:grid;grid-template-columns:1.32fr .68fr;gap:22px}
.clip-stack{display:grid;grid-template-rows:1fr 1fr;gap:22px}
.clip-card{min-width:0}
.clip-frame{position:relative;overflow:hidden;height:232px;border:1px solid rgba(255,255,255,.18);background:#27232f;box-shadow:8px 8px 0 rgba(255,255,255,.055);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.clip-card.featured .clip-frame{height:486px}
.clip-card:hover .clip-frame{transform:translate(-3px,-3px);border-color:rgba(255,255,255,.18);box-shadow:11px 11px 0 rgba(243,71,89,.22)}
.clip-frame:before{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(145deg,#252b43,#6177f7 48%,#f34759 49%,#241d2b 75%)}
.clip-frame .media-fill{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.clip-card:hover .clip-frame .media-fill{transform:scale(1.02)}
.clip-no{position:absolute;z-index:4;left:13px;top:13px;padding:6px 8px;border:1px solid rgba(23,20,29,.7);background:rgba(248,243,232,.92);color:var(--ink);font:700 7px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.clip-play{position:absolute;z-index:4;right:14px;bottom:14px;display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font-size:14px;transition:transform .2s ease}
.clip-card:hover .clip-play{transform:rotate(-8deg) scale(1.04)}
.clip-meta{display:flex;justify-content:space-between;gap:20px;align-items:baseline;padding:14px 2px 2px}
.clip-meta h3{margin:0;font:900 30px/.95 var(--display);text-transform:uppercase}
.clip-meta span{color:var(--yellow);font:700 7px var(--mono);letter-spacing:.09em;text-transform:uppercase;text-align:right}
.clip-card.featured .clip-meta h3{font-size:42px}

/* Side projects --------------------------------------------------------- */
.side-section{background:var(--paper-2);border-bottom:1px solid var(--line)}
.side-section .section-head{margin-bottom:28px;align-items:end}
.side-section .section-head h2{font-size:clamp(48px,5.6vw,78px);line-height:.9}
.side-section .section-note{max-width:360px}
.side-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;perspective:1100px;perspective-origin:50% 45%}
.side-card{
  --side-tilt-x:0deg;--side-tilt-y:0deg;--side-lift:0px;
  position:relative;min-height:240px;padding:22px;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.36);
  border:1px solid rgba(23,20,29,.13);
  box-shadow:0 1px 0 rgba(23,20,29,.04);
  transform:translate3d(0,var(--side-lift),0) rotateX(var(--side-tilt-x)) rotateY(var(--side-tilt-y));
  transform-style:preserve-3d;transform-origin:50% 50%;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .2s ease,box-shadow .2s ease,background .2s ease,opacity .08s linear;
  will-change:transform;cursor:crosshair
}
.side-card:before{content:none}
.side-card:hover{
  --side-lift:-3px;
  background:rgba(255,255,255,.62);
  border-color:rgba(23,20,29,.24);
  box-shadow:0 10px 24px rgba(23,20,29,.07)
}
.side-index{display:flex;align-items:center;gap:9px;font:700 7px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.side-index:before{content:"";width:18px;height:2px;background:var(--red);flex:0 0 auto}
.side-card h3{margin:24px 0 10px;font:900 clamp(28px,2.5vw,38px)/.96 var(--display);letter-spacing:-.01em;text-transform:uppercase}

/* Original portfolio button motion ----------------------------------------
   Restores the tactile shadow + colour sweep without changing v4 sizing. */
.btn{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  cursor:pointer;
  transition:
    transform .18s cubic-bezier(.2,.8,.2,1),
    box-shadow .18s cubic-bezier(.2,.8,.2,1),
    background-color .18s ease,
    color .18s ease,
    border-color .18s ease;
}
.btn::before{
  content:"";
  position:absolute;
  z-index:-1;
  inset:-2px;
  background:var(--red);
  transform:translateX(-105%) skewX(-18deg);
  transition:transform .34s cubic-bezier(.2,.75,.25,1);
}
.btn:hover{
  transform:translate(-4px,-4px) rotate(-.35deg);
  box-shadow:6px 6px 0 currentColor;
}
.btn:hover::before{transform:translateX(0) skewX(-18deg)}
.btn:active{
  transform:translate(1px,1px) scale(.985);
  box-shadow:1px 1px 0 currentColor;
  transition-duration:.07s;
}
.btn .btn-icon{
  display:inline-block;
  min-width:1.2em;
  margin-left:8px;
  text-align:center;
  transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
.btn:hover .btn-icon{transform:translate(3px,-3px) rotate(8deg)}

/* Keep the contact actions distinct while using the same motion language. */
.contact-panel .btn.primary::before{background:var(--red)}
.contact-panel .btn.ghost::before{background:var(--blue)}
.contact-panel .btn.roblox::before{background:var(--yellow)}
.copy-discord.is-copied{
  background:#71e38c;
  transform:translate(-2px,-2px) rotate(.25deg);
}

@media(prefers-reduced-motion:reduce){
  .btn,.btn::before,.btn .btn-icon{transition:none!important}
  .btn:hover,.btn:active,.copy-discord.is-copied{transform:none!important}
  .btn::before{transform:none;opacity:0}
}

  transition:transform .2s cubic-bezier(.2,.9,.24,1.16),box-shadow .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease;

  --project-lift-x:-5px;--project-lift-y:-6px;--project-rz:-.32deg;
  --project-bg-scale:1.055;--project-media-scale:1.045;
  box-shadow:14px 14px 0 var(--red)
}

  transform:translate3d(var(--project-bg-x),var(--project-bg-y),0) scale(var(--project-bg-scale));
  transform-origin:50% 50%;will-change:transform;

}

@media(prefers-reduced-motion:reduce){

const escapeHTML = (value = '') => String(value)
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'",'&#039;');

function mediaMarkup(media = {}, placeholder = 'ADD PREVIEW') {
  const src = media.src || '';
  const type = media.type || 'image';
  const alt = escapeHTML(media.alt || 'Portfolio preview');
  if (!src) return `<span class="media-placeholder">${escapeHTML(placeholder)}</span>`;
  if (type === 'video') {
    const poster = media.poster ? ` poster="${escapeHTML(media.poster)}"` : '';
    return `<video class="media-fill" autoplay muted loop playsinline preload="metadata"${poster} aria-label="${alt}"><source src="${escapeHTML(src)}"></video>`;
  }
  if (type === 'youtube') {
    return `<iframe class="media-fill" src="${escapeHTML(src)}" title="${alt}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  }
  return `<img class="media-fill" src="${escapeHTML(src)}" alt="${alt}" loading="lazy">`;
}

function optionalLink(url, className, label, attrs='') {
  if (!url) return '';
  return `<a class="${className}" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" ${attrs}>${label}</a>`;
}

function setupInteractiveDotBackgrounds() {
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const parseRGBA = color => {
    const match = color.match(/rgba?\(([^)]+)\)/i);
    if (!match) return null;
    const values = match[1].split(',').map(value => Number.parseFloat(value.trim()));
    return {r:values[0] || 0,g:values[1] || 0,b:values[2] || 0,a:Number.isFinite(values[3]) ? values[3] : 1};
  };
  const isDarkBackground = element => {
    const rgba = parseRGBA(getComputedStyle(element).backgroundColor);
    if (!rgba || rgba.a < .5) return false;
    const luminance = (.2126 * rgba.r + .7152 * rgba.g + .0722 * rgba.b) / 255;
    return luminance < .16;
  };

  document.querySelectorAll('section').forEach(section => {
    if (!isDarkBackground(section) || section.querySelector(':scope > .interactive-dot-field')) return;

    section.classList.add('dark-dot-section');
    const canvas = document.createElement('canvas');
    canvas.className = 'interactive-dot-field';
    canvas.setAttribute('aria-hidden','true');
    section.prepend(canvas);

    const ctx = canvas.getContext('2d', {alpha:true});
    if (!ctx) return;

    const pointer = {x:0,y:0,inside:false,strength:0};
    const spacing = 22;
    const radius = 132;
    let width = 0;
    let height = 0;
    let dots = [];
    let frame = 0;
    let visible = true;

    const rebuild = () => {
      const rect = section.getBoundingClientRect();
      width = Math.max(1, Math.round(rect.width));
      height = Math.max(1, Math.round(rect.height));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr,0,0,dpr,0,0);

      dots = [];
      const offsetX = (width % spacing) * .5;
      const offsetY = (height % spacing) * .5;
      for (let y = offsetY; y <= height + spacing; y += spacing) {
        for (let x = offsetX; x <= width + spacing; x += spacing) {
          dots.push({x,y,phase:((x * .013) + (y * .021)) % (Math.PI * 2)});
        }
      }
      draw(performance.now());
    };

    const draw = now => {
      frame = 0;
      if (!visible) return;
      ctx.clearRect(0,0,width,height);
      pointer.strength += ((pointer.inside ? 1 : 0) - pointer.strength) * .11;
      const t = now * .001;

      for (const dot of dots) {
        const dx = dot.x - pointer.x;
        const dy = dot.y - pointer.y;
        const distance = Math.hypot(dx,dy);
        const influence = pointer.strength * Math.max(0,1 - distance / radius);
        const eased = influence * influence * (3 - 2 * influence);
        const inv = distance > .001 ? 1 / distance : 0;
        const push = eased * 10.5;
        const driftX = reducedMotion ? 0 : Math.sin(t * .7 + dot.phase) * .28;
        const driftY = reducedMotion ? 0 : Math.cos(t * .62 + dot.phase) * .28;
        const x = dot.x + dx * inv * push + driftX;
        const y = dot.y + dy * inv * push + driftY;
        const dotRadius = 1 + eased * .72;
        const alpha = .13 + eased * .5;

        ctx.beginPath();
        ctx.arc(x,y,dotRadius,0,Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
        ctx.fill();
      }

      if (!reducedMotion && (pointer.inside || pointer.strength > .015)) {
        frame = requestAnimationFrame(draw);
      }
    };

    const requestDraw = () => {
      if (!frame && visible) frame = requestAnimationFrame(draw);
    };

    section.addEventListener('pointerenter', event => {
      if (reducedMotion || event.pointerType === 'touch') return;
      pointer.inside = true;
      const rect = section.getBoundingClientRect();
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;
      requestDraw();
    });

    section.addEventListener('pointermove', event => {
      if (reducedMotion || event.pointerType === 'touch') return;
      const rect = section.getBoundingClientRect();
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;
      pointer.inside = true;
      requestDraw();
    }, {passive:true});

    const releasePointer = () => {
      if (reducedMotion) return;
      pointer.inside = false;
      requestDraw();
    };
    section.addEventListener('pointerleave', releasePointer);
    section.addEventListener('pointercancel', releasePointer);

    if ('ResizeObserver' in window) {
      new ResizeObserver(rebuild).observe(section);
    } else {
      window.addEventListener('resize', rebuild, {passive:true});
    }

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(entries => {
        visible = entries[0]?.isIntersecting ?? true;
        if (visible) requestDraw();
        else if (frame) { cancelAnimationFrame(frame); frame = 0; }
      }, {rootMargin:'160px'}).observe(section);
    }

    rebuild();
  });
}


function setupPlayfulPortfolioCards() {
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (reducedMotion || !finePointer) return;

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  document.querySelectorAll('.project-card').forEach(card => {
    const preview = card.querySelector('.project-preview');
    if (!preview) return;
    let frame = 0;

    const reset = () => {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      card.classList.remove('is-hovered');
      preview.style.setProperty('--project-rx','0deg');
      preview.style.setProperty('--project-ry','0deg');
      preview.style.setProperty('--project-bg-x','0px');
      preview.style.setProperty('--project-bg-y','0px');
      preview.style.setProperty('--project-media-x','0px');
      preview.style.setProperty('--project-media-y','0px');
      preview.style.setProperty('--project-magnet-x','0px');
      preview.style.setProperty('--project-magnet-y','0px');
    };

    const update = event => {
      if (event.pointerType === 'touch') return;
      const rect = preview.getBoundingClientRect();
      const px = clamp((event.clientX - rect.left) / Math.max(rect.width,1), 0, 1);
      const py = clamp((event.clientY - rect.top) / Math.max(rect.height,1), 0, 1);
      const x = px * 2 - 1;
      const y = py * 2 - 1;

      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        preview.style.setProperty('--project-rx', `${(-y * 2.3).toFixed(2)}deg`);
        preview.style.setProperty('--project-ry', `${(x * 3.1).toFixed(2)}deg`);
        preview.style.setProperty('--project-bg-x', `${(x * 5.5).toFixed(2)}px`);
        preview.style.setProperty('--project-bg-y', `${(y * 4.5).toFixed(2)}px`);
        preview.style.setProperty('--project-media-x', `${(-x * 8.5).toFixed(2)}px`);
        preview.style.setProperty('--project-media-y', `${(-y * 6.5).toFixed(2)}px`);
        preview.style.setProperty('--project-magnet-x', `${(x * 11).toFixed(2)}px`);
        preview.style.setProperty('--project-magnet-y', `${(y * 8).toFixed(2)}px`);
        frame = 0;
      });
    };

    preview.addEventListener('pointerenter', event => {
      if (event.pointerType === 'touch') return;
      card.classList.add('is-hovered');
      update(event);
    });
    preview.addEventListener('pointermove', update, {passive:true});
    preview.addEventListener('pointerleave', reset);
    preview.addEventListener('pointercancel', reset);
  });

  document.querySelectorAll('.clip-card').forEach(card => {
    const frameEl = card.querySelector('.clip-frame');
    if (!frameEl) return;
    let frame = 0;

    const reset = () => {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      card.classList.remove('is-hovered');
      frameEl.style.setProperty('--clip-rx','0deg');
      frameEl.style.setProperty('--clip-ry','0deg');
      frameEl.style.setProperty('--clip-bg-x','0px');
      frameEl.style.setProperty('--clip-bg-y','0px');
      frameEl.style.setProperty('--clip-media-x','0px');
      frameEl.style.setProperty('--clip-media-y','0px');
    };

    const update = event => {
      if (event.pointerType === 'touch') return;
      const rect = frameEl.getBoundingClientRect();
      const px = clamp((event.clientX - rect.left) / Math.max(rect.width,1), 0, 1);
      const py = clamp((event.clientY - rect.top) / Math.max(rect.height,1), 0, 1);
      const x = px * 2 - 1;
      const y = py * 2 - 1;

      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        frameEl.style.setProperty('--clip-rx', `${(-y * 1.8).toFixed(2)}deg`);
        frameEl.style.setProperty('--clip-ry', `${(x * 2.7).toFixed(2)}deg`);
        frameEl.style.setProperty('--clip-bg-x', `${(x * 4.5).toFixed(2)}px`);
        frameEl.style.setProperty('--clip-bg-y', `${(y * 3.5).toFixed(2)}px`);
        frameEl.style.setProperty('--clip-media-x', `${(-x * 7).toFixed(2)}px`);
        frameEl.style.setProperty('--clip-media-y', `${(-y * 5).toFixed(2)}px`);
        frame = 0;
      });
    };

    frameEl.addEventListener('pointerenter', event => {
      if (event.pointerType === 'touch') return;
      card.classList.add('is-hovered');
      update(event);
    });
    frameEl.addEventListener('pointermove', update, {passive:true});
    frameEl.addEventListener('pointerleave', reset);
    frameEl.addEventListener('pointercancel', reset);
  });
}

function bindInteractions() {
  setupInteractiveDotBackgrounds();
  setupPlayfulPortfolioCards();

  const copy = document.querySelector('.copy-discord');
  if (copy) {
    const label = copy.querySelector('.copy-label');
    const original = label?.textContent || '';
    copy.addEventListener('click', async () => {
      const value = copy.dataset.tag || '';
      let ok = false;
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(value); ok = true; }
        else {
          const input = document.createElement('input'); input.value = value; input.style.position='fixed'; input.style.opacity='0';
          document.body.appendChild(input); input.select(); ok = document.execCommand('copy'); input.remove();
        }
      } catch (_) {}
      if (label) label.textContent = ok ? `Copied ${value} ✓` : `Discord: ${value}`;
      if (ok) copy.classList.add('is-copied');
      setTimeout(() => { if (label) label.textContent = original; copy.classList.remove('is-copied'); }, 1500);
    });
  }

  const heroWrap = document.querySelector('.hero-media-wrap');
  const heroMedia = heroWrap?.querySelector('.hero-media');
  const heroFill = heroMedia?.querySelector('.media-fill');
  const aboutCard = document.querySelector('.about-card');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const SHATTER_SHAPES = [
    {clip:'polygon(0 0,34% 0,29% 26%,12% 39%,0 33%)', cx:.14, cy:.17},
    {clip:'polygon(34% 0,70% 0,63% 30%,46% 22%,29% 26%)', cx:.49, cy:.14},
    {clip:'polygon(70% 0,100% 0,100% 30%,78% 37%,63% 30%)', cx:.84, cy:.17},
    {clip:'polygon(0 33%,12% 39%,29% 26%,36% 55%,22% 71%,0 64%)', cx:.15, cy:.50},
    {clip:'polygon(29% 26%,46% 22%,63% 30%,70% 57%,52% 72%,36% 55%)', cx:.50, cy:.47},
    {clip:'polygon(63% 30%,78% 37%,100% 30%,100% 63%,80% 72%,70% 57%)', cx:.84, cy:.50},
    {clip:'polygon(0 64%,22% 71%,36% 55%,43% 100%,0 100%)', cx:.17, cy:.82},
    {clip:'polygon(36% 55%,52% 72%,70% 57%,80% 72%,68% 100%,43% 100%)', cx:.57, cy:.81},
    {clip:'polygon(70% 57%,80% 72%,100% 63%,100% 100%,68% 100%)', cx:.86, cy:.82}
  ];

  function shatterAndRealign(target, event) {
    if (!target || reducedMotion || target.classList.contains('is-shattering')) return;

    const parent = target.parentElement;
    if (!parent) return;

    const computed = getComputedStyle(target);
    const rect = target.getBoundingClientRect();
    const localX = Math.max(0, Math.min(target.offsetWidth, ((event.clientX - rect.left) / Math.max(rect.width, 1)) * target.offsetWidth));
    const localY = Math.max(0, Math.min(target.offsetHeight, ((event.clientY - rect.top) / Math.max(rect.height, 1)) * target.offsetHeight));
    const originX = localX / Math.max(target.offsetWidth, 1);
    const originY = localY / Math.max(target.offsetHeight, 1);
    const power = target.classList.contains('hero-media') ? 132 : target.classList.contains('about-card') ? 118 : 108;

    target.classList.add('is-shattering');

    const stage = document.createElement('div');
    stage.className = 'shatter-stage';
    stage.style.left = `${target.offsetLeft}px`;
    stage.style.top = `${target.offsetTop}px`;
    stage.style.width = `${target.offsetWidth}px`;
    stage.style.height = `${target.offsetHeight}px`;
    stage.style.transform = computed.transform === 'none' ? 'none' : computed.transform;
    stage.style.transformOrigin = computed.transformOrigin;
    parent.appendChild(stage);

    // A quick crack flash from the exact click point, then the pieces burst apart.
    const crackAngles = [-162,-126,-92,-51,-18,17,49,83,118,151];
    crackAngles.forEach((angle, i) => {
      const crack = document.createElement('span');
      crack.className = 'shatter-crack';
      crack.style.left = `${localX}px`;
      crack.style.top = `${localY}px`;
      crack.style.setProperty('--crack-angle', `${angle}deg`);
      crack.style.setProperty('--crack-length', `${46 + ((i * 19) % 58)}px`);
      stage.appendChild(crack);
    });

    const animations = [];
    SHATTER_SHAPES.forEach((shape, index) => {
      const piece = document.createElement('div');
      piece.className = 'shatter-piece';
      piece.style.clipPath = shape.clip;

      const surface = target.cloneNode(true);
      surface.classList.remove('is-hovered','is-pressed','is-shattering');
      surface.classList.add('shatter-surface');
      surface.removeAttribute('id');
      piece.appendChild(surface);
      stage.appendChild(piece);

      let vx = shape.cx - originX;
      let vy = shape.cy - originY;
      let mag = Math.hypot(vx, vy);
      if (mag < .12) {
        const fallback = (index / SHATTER_SHAPES.length) * Math.PI * 2;
        vx = Math.cos(fallback);
        vy = Math.sin(fallback);
        mag = 1;
      }
      vx /= mag;
      vy /= mag;

      const distanceBoost = 1.04 + Math.min(1, mag) * 1.02;
      const radialScatter = 1.34;
      const dx = vx * power * distanceBoost * radialScatter;
      const dy = vy * power * distanceBoost * radialScatter;
      const rz = (shape.cx < .5 ? -1 : 1) * (12 + index * 2.6) + vy * 16;
      const rx = -vy * 24;
      const ry = vx * 28;
      const dz = 26 + (index % 3) * 12;

      const flingX = dx * 1.14;
      const flingY = dy * 1.14;
      const settleX = dx * .98;
      const settleY = dy * .98;
      const settleZ = dz * .92;

      const animation = piece.animate([
        {transform:'translate3d(0,0,0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)', offset:0},
        {transform:`translate3d(${flingX * .34}px,${flingY * .34}px,${dz * .34}px) rotateX(${rx * .36}deg) rotateY(${ry * .36}deg) rotateZ(${rz * .32}deg) scale(.994)`, offset:.08},
        {transform:`translate3d(${flingX}px,${flingY}px,${dz * 1.08}px) rotateX(${rx * 1.12}deg) rotateY(${ry * 1.12}deg) rotateZ(${rz * 1.12}deg) scale(.948)`, offset:.18},
        {transform:`translate3d(${settleX}px,${settleY}px,${settleZ}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(.956)`, offset:.28},
        {transform:`translate3d(${settleX}px,${settleY}px,${settleZ}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(.956)`, offset:.79},
        {transform:`translate3d(${dx * .24}px,${dy * .24}px,${dz * .15}px) rotateX(${rx * .18}deg) rotateY(${ry * .18}deg) rotateZ(${rz * .18}deg) scale(1.018)`, offset:.93},
        {transform:'translate3d(0,0,0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)', offset:1}
      ], {
        duration: 2400,
        easing:'cubic-bezier(.16,.78,.18,1)',
        fill:'both'
      });
      animations.push(animation.finished.catch(() => {}));
    });

    target.style.opacity = '0';

    Promise.all(animations).then(() => {
      stage.remove();
      target.style.opacity = '';
      target.classList.remove('is-shattering');
    });
  }

  if (heroWrap && heroMedia) {
    let frame = 0;

    const resetHero = () => {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      heroWrap.classList.remove('is-hovered');
      heroMedia.style.setProperty('--hero-tilt-x','0deg');
      heroMedia.style.setProperty('--hero-tilt-y','0deg');
      heroMedia.style.setProperty('--hero-shift-x','0px');
      heroMedia.style.setProperty('--hero-shift-y','0px');
      if (heroFill) {
        heroFill.style.setProperty('--hero-media-x','0px');
        heroFill.style.setProperty('--hero-media-y','0px');
      }
    };

    heroWrap.addEventListener('pointerenter', event => {
      if (event.pointerType !== 'touch') heroWrap.classList.add('is-hovered');
    });

    heroWrap.addEventListener('pointermove', event => {
      if (reducedMotion || event.pointerType === 'touch' || heroMedia.classList.contains('is-shattering')) return;
      const rect = heroWrap.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width) * 2 - 1));
      const y = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height) * 2 - 1));

      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        heroMedia.style.setProperty('--hero-tilt-x', `${(-y * 9.5).toFixed(2)}deg`);
        heroMedia.style.setProperty('--hero-tilt-y', `${(x * 12.5).toFixed(2)}deg`);
        heroMedia.style.setProperty('--hero-shift-x', `${(x * 17).toFixed(2)}px`);
        heroMedia.style.setProperty('--hero-shift-y', `${(y * 12).toFixed(2)}px`);
        if (heroFill) {
          heroFill.style.setProperty('--hero-media-x', `${(-x * 13).toFixed(2)}px`);
          heroFill.style.setProperty('--hero-media-y', `${(-y * 10).toFixed(2)}px`);
        }
        frame = 0;
      });
    });

    heroWrap.addEventListener('pointerleave', resetHero);
    heroWrap.addEventListener('pointercancel', resetHero);
    heroMedia.addEventListener('click', event => {
      heroMedia.classList.add('has-been-clicked');
      shatterAndRealign(heroMedia, event);
    });
  }

  if (aboutCard) {
    let aboutFrame = 0;

    const resetAboutCard = () => {
      if (aboutFrame) cancelAnimationFrame(aboutFrame);
      aboutFrame = 0;
      aboutCard.classList.remove('is-hovered');
      aboutCard.style.setProperty('--about-tilt-x','0deg');
      aboutCard.style.setProperty('--about-tilt-y','0deg');
      aboutCard.style.setProperty('--about-shift-x','0px');
      aboutCard.style.setProperty('--about-shift-y','0px');
    };

    aboutCard.addEventListener('pointerenter', event => {
      if (event.pointerType !== 'touch') aboutCard.classList.add('is-hovered');
    });

    aboutCard.addEventListener('pointermove', event => {
      if (reducedMotion || event.pointerType === 'touch' || aboutCard.classList.contains('is-shattering')) return;
      const rect = aboutCard.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width) * 2 - 1));
      const y = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height) * 2 - 1));

      if (aboutFrame) cancelAnimationFrame(aboutFrame);
      aboutFrame = requestAnimationFrame(() => {
        aboutCard.style.setProperty('--about-tilt-x', `${(-y * 10.5).toFixed(2)}deg`);
        aboutCard.style.setProperty('--about-tilt-y', `${(x * 14).toFixed(2)}deg`);
        aboutCard.style.setProperty('--about-shift-x', `${(x * 18).toFixed(2)}px`);
        aboutCard.style.setProperty('--about-shift-y', `${(y * 13).toFixed(2)}px`);
        aboutFrame = 0;
      });
    });

    aboutCard.addEventListener('pointerleave', resetAboutCard);
    aboutCard.addEventListener('pointercancel', resetAboutCard);
    aboutCard.addEventListener('click', event => shatterAndRealign(aboutCard, event));
  }

  const sideCards = document.querySelectorAll('.side-card');
  sideCards.forEach(sideCard => {
    let sideFrame = 0;

    const resetSideCard = () => {
      if (sideFrame) cancelAnimationFrame(sideFrame);
      sideFrame = 0;
      sideCard.style.setProperty('--side-tilt-x','0deg');
      sideCard.style.setProperty('--side-tilt-y','0deg');
    };

    sideCard.addEventListener('pointermove', event => {
      if (reducedMotion || event.pointerType === 'touch' || sideCard.classList.contains('is-shattering')) return;
      const rect = sideCard.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width) * 2 - 1));
      const y = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height) * 2 - 1));

      if (sideFrame) cancelAnimationFrame(sideFrame);
      sideFrame = requestAnimationFrame(() => {
        sideCard.style.setProperty('--side-tilt-x', `${(-y * 3.4).toFixed(2)}deg`);
        sideCard.style.setProperty('--side-tilt-y', `${(x * 4.6).toFixed(2)}deg`);
        sideFrame = 0;
      });
    });

    sideCard.addEventListener('pointerleave', resetSideCard);
    sideCard.addEventListener('pointercancel', resetSideCard);
  });

  const contactPanel = document.querySelector('.contact-panel');
  if (contactPanel) {
    let contactFrame = 0;

    const resetContactPanel = () => {
      if (contactFrame) cancelAnimationFrame(contactFrame);
      contactFrame = 0;
      contactPanel.classList.remove('is-hovered');
      contactPanel.style.setProperty('--contact-tilt-x','0deg');
      contactPanel.style.setProperty('--contact-tilt-y','0deg');
      contactPanel.style.setProperty('--contact-shift-x','0px');
      contactPanel.style.setProperty('--contact-shift-y','0px');
    };

    contactPanel.addEventListener('pointerenter', event => {
      if (event.pointerType !== 'touch') contactPanel.classList.add('is-hovered');
    });

    contactPanel.addEventListener('pointermove', event => {
      if (reducedMotion || event.pointerType === 'touch' || contactPanel.classList.contains('is-shattering')) return;
      const rect = contactPanel.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width) * 2 - 1));
      const y = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height) * 2 - 1));

      if (contactFrame) cancelAnimationFrame(contactFrame);
      contactFrame = requestAnimationFrame(() => {
        contactPanel.style.setProperty('--contact-tilt-x', `${(-y * 8.2).toFixed(2)}deg`);
        contactPanel.style.setProperty('--contact-tilt-y', `${(x * 11).toFixed(2)}deg`);
        contactPanel.style.setProperty('--contact-shift-x', `${(x * 15).toFixed(2)}px`);
        contactPanel.style.setProperty('--contact-shift-y', `${(y * 10).toFixed(2)}px`);
        contactFrame = 0;
      });
    });

    contactPanel.addEventListener('pointerleave', resetContactPanel);
    contactPanel.addEventListener('pointercancel', resetContactPanel);
    contactPanel.addEventListener('click', event => shatterAndRealign(contactPanel, event));
  }

  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    }), {threshold:.1, rootMargin:'0px 0px -7% 0px'});
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  } else {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
  }
}

render();

const siteHeader = document.querySelector('.topbar');
if (siteHeader) {
  const syncHeaderState = () => siteHeader.classList.toggle('is-scrolled', window.scrollY > 10);
  syncHeaderState();
  window.addEventListener('scroll', syncHeaderState, {passive:true});
}
</script>
</body>
</html>
